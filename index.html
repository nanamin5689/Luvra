<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>OpenVideo</title>
<meta name="description" content="Snap post၊ ရုပ်ရှင်၊ ရယ်စရာ camera template များ တစ်နေရာတည်းတွင်။">
<style>
:root{--bg:#0b0d12;--sf:#151922;--sf2:#1d2330;--tx:#eef1f6;--mu:#98a2b3;--ac:#6c8cff;--ac2:#ff5fa2;--ok:#34d399;--bd:#242b39;--nav:64px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,"Noto Sans Myanmar","Padauk",sans-serif;overscroll-behavior:none}
#app{height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative;background:var(--bg)}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font-family:inherit;font-size:1rem;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:11px 13px;width:100%}
a{color:var(--ac)}
.btn{background:var(--ac);color:#fff;border-radius:12px;padding:11px 16px;font-size:.95rem;font-weight:600}
.btn.alt{background:var(--sf2)}
.btn.pink{background:linear-gradient(135deg,var(--ac),var(--ac2))}
.btn:disabled{opacity:.5}

/* top bar */
#top{display:flex;align-items:center;padding-top:env(safe-area-inset-top);border-bottom:1px solid var(--bd);background:var(--bg);position:relative;z-index:5}
#cats{flex:1;display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;padding:10px 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#cats::-webkit-scrollbar{display:none}
.cat{flex:0 0 auto;scroll-snap-align:center;padding:7px 15px;border-radius:99px;background:var(--sf);color:var(--mu);font-size:.9rem;white-space:nowrap}
.cat.on{background:var(--tx);color:#0b0d12;font-weight:700}
#srchBtn{flex:0 0 auto;width:44px;height:44px;margin:0 8px 0 2px;border-radius:50%;background:var(--sf);display:grid;place-items:center;box-shadow:-14px 0 14px 4px var(--bg)}
#srchBtn svg{width:22px;height:22px}

/* views */
#main{flex:1;position:relative;min-height:0}
.view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pad{padding:12px 12px 24px}
.msg{text-align:center;color:var(--mu);padding:36px 12px;line-height:1.7}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:18px;margin:12px 0}
.card h3{margin:0 0 6px}
.card p{margin:6px 0;color:var(--mu);line-height:1.6;font-size:.92rem}

/* post */
.post{background:var(--sf);border:1px solid var(--bd);border-radius:18px;margin:0 0 14px;overflow:hidden}
.ph{display:flex;align-items:center;gap:10px;padding:10px 12px}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;font-weight:700;flex:0 0 auto}
.pm{flex:1;min-width:0}
.pm b{display:block;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm small{color:var(--mu);font-size:.78rem}
.fbtn{padding:6px 12px;border-radius:99px;border:1px solid var(--ac);color:var(--ac);font-size:.82rem;font-weight:600}
.fbtn.on{background:var(--sf2);border-color:var(--bd);color:var(--mu)}
.dots{padding:6px 8px;color:var(--mu);font-size:1.2rem;line-height:1}
.post .media{width:100%;max-height:70vh;object-fit:contain;background:#000;display:block}
.cap{margin:0;padding:10px 14px 14px;line-height:1.55;font-size:.95rem}

/* video grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vc{background:var(--sf);border-radius:14px;overflow:hidden;text-align:left;display:block;width:100%}
.vc .th{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:#222}
.vc .b{padding:8px 10px 10px}
.vc h4{margin:0 0 3px;font-size:.84rem;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:600}
.vc small{color:var(--mu);font-size:.72rem}
.more{display:block;margin:16px auto 0}

/* nav */
#nav{display:flex;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:rgba(21,25,34,.96);border-top:1px solid var(--bd);backdrop-filter:blur(8px)}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--mu);font-size:.68rem}
#nav svg{width:25px;height:25px}
#nav button.on{color:var(--tx)}
#nav button.on svg{color:var(--ac)}
#nav .cam .ring{width:46px;height:34px;border-radius:12px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;color:#fff}
#nav .cam svg{width:24px;height:24px;color:#fff}
#nav .cam{gap:0;font-size:0}

/* overlays */
.ov{position:fixed;inset:0;background:var(--bg);z-index:30;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.ovh{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;border-bottom:1px solid var(--bd)}
.ovh h2{flex:1;margin:0;font-size:1rem;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.x{width:38px;height:38px;border-radius:50%;background:var(--sf);font-size:1.1rem}
.ovb{flex:1;overflow-y:auto;padding:12px}
.player{width:100%;aspect-ratio:16/9;border:0;background:#000;display:block;border-radius:12px}
.info p{color:var(--mu);font-size:.88rem;line-height:1.6;margin:8px 0}
.sec{margin:16px 0 8px;color:var(--mu);font-size:.85rem;font-weight:700}
.hrow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--sf);border-radius:12px;padding:8px;margin-bottom:10px}
.hrow img,.hrow .ph0{width:96px;aspect-ratio:16/10;object-fit:cover;border-radius:8px;background:#222;flex:0 0 auto}
.hrow b{display:block;font-size:.88rem;line-height:1.35}
.hrow small{color:var(--mu)}
#toast{position:fixed;left:50%;bottom:calc(var(--nav) + 24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:99px;font-size:.88rem;z-index:60;max-width:90vw;text-align:center}

/* camera */
#v-camera{display:flex;flex-direction:column;overflow:hidden;background:#000}
.stage{flex:1;min-height:0;position:relative;overflow:hidden;background:#000}
#cv{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;touch-action:none;background:#111}
.hint{position:absolute;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);padding:6px 12px;border-radius:99px;font-size:.78rem;pointer-events:none;white-space:nowrap}
.timer{position:absolute;top:calc(44px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#e11d48;padding:3px 10px;border-radius:99px;font-size:.8rem;font-weight:700}
.tools{background:var(--bg);padding:8px 10px 6px}
.tpls{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.tpls::-webkit-scrollbar{display:none}
.tp{flex:0 0 auto;width:62px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mu);font-size:.66rem}
.tp i{font-style:normal;width:46px;height:46px;border-radius:14px;background:var(--sf);display:grid;place-items:center;font-size:1.4rem;border:2px solid transparent}
.tp.on i{border-color:var(--ac2)}
.tp.on{color:var(--tx)}
.sl{display:flex;gap:10px}
.sl label{flex:1;font-size:.7rem;color:var(--mu);display:flex;flex-direction:column;gap:2px}
.sl input{padding:0;border:0;background:none;height:22px}
#capt{padding:8px 12px;margin:4px 0 6px;font-size:.9rem}
.shut{display:flex;align-items:center;justify-content:space-around;padding:2px 0 4px}
.sbtn{width:46px;height:46px;border-radius:50%;background:var(--sf);font-size:1.2rem}
#shut{width:68px;height:68px;border-radius:50%;border:4px solid #fff;background:none;position:relative}
#shut::after{content:"";position:absolute;inset:5px;border-radius:50%;background:#fff;transition:.15s}
#shut.vid::after{background:#ef4444}
#shut.rec::after{inset:18px;border-radius:8px;background:#ef4444}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div id="cats" role="tablist" aria-label="အမျိုးအစားများ"></div>
    <button id="srchBtn" aria-label="ရှာဖွေရန်">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
    </button>
  </header>

  <main id="main">
    <section class="view" id="v-home"><div class="pad"><div id="feed"></div><button class="btn alt more" id="hmore" hidden>ထပ်ကြည့်မည်</button></div></section>
    <section class="view" id="v-video" hidden><div class="pad"><div class="grid" id="vgrid"></div><div id="vstat" class="msg"></div><button class="btn alt more" id="vmore" hidden>ထပ်ကြည့်မည်</button></div></section>
    <section class="view" id="v-camera" hidden>
      <div id="camGate" class="pad" hidden></div>
      <div id="camUI" style="display:flex;flex-direction:column;flex:1;min-height:0">
        <div class="stage">
          <canvas id="cv" width="720" height="1280"></canvas>
          <div class="hint" id="camHint">မျက်နှာပေါ်ကို ထိ/ဆွဲပြီး effect နေရာချပါ</div>
          <div class="timer" id="timer" hidden>● 0:00</div>
        </div>
        <div class="tools">
          <div class="tpls" id="tpls"></div>
          <div class="sl">
            <label>အရွယ်အစား<input type="range" id="sz" min="0.08" max="0.36" step="0.01" value="0.2"></label>
            <label>အားပြင်း<input type="range" id="st" min="0.1" max="1.6" step="0.05" value="0.8"></label>
          </div>
          <input id="capt" placeholder="စာတန်း (meme) ထည့်ရန်…" maxlength="40">
          <div class="shut">
            <button class="sbtn" id="modeBtn" aria-label="ပုံ/ဗီဒီယို ပြောင်းရန်">📷</button>
            <button id="shut" aria-label="ရိုက်ရန်"></button>
            <button class="sbtn" id="flip" aria-label="ကင်မရာလှည့်ရန်">🔄</button>
          </div>
        </div>
      </div>
    </section>
    <section class="view" id="v-history" hidden><div class="pad" id="hist"></div></section>
    <section class="view" id="v-profile" hidden><div class="pad" id="prof"></div></section>
  </main>

  <nav id="nav" aria-label="ပင်မမီနူး"></nav>
</div>
<div id="toast" hidden></div>
<div id="layer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
"use strict";
const C = window.CONFIG || {};
const $ = s => document.querySelector(s);
const sb = (C.SUPABASE_URL && C.SUPABASE_ANON_KEY && window.supabase)
  ? supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY) : null;
const PER = 12;

/* ---------- helpers ---------- */
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for(const k in (attrs || {})){
    const v = attrs[k];
    if(v == null || v === false) continue;
    if(k === "class") e.className = v;
    else if(k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if(k === "svg") e.innerHTML = v;        // static icon markup only
    else e.setAttribute(k, v === true ? "" : v);
  }
  kids.flat().forEach(c => { if(c == null || c === false) return; e.append(c.nodeType ? c : document.createTextNode(c)); });
  return e;
}
let toastT;
function toast(m){ const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }
function ago(ts){
  const m = Math.max(1, Math.round((Date.now() - new Date(ts)) / 60000));
  if(m < 60) return m + " မိနစ်က";
  const hr = Math.round(m / 60);
  return hr < 24 ? hr + " နာရီက" : Math.round(hr / 24) + " ရက်က";
}
function left(p){
  const m = Math.round((new Date(p.expires_at) - Date.now()) / 60000);
  if(m <= 0) return "သက်တမ်းကုန်ပြီ";
  return m < 60 ? m + " မိနစ် ကျန်" : Math.floor(m / 60) + " နာရီ ကျန်";
}

/* ---------- state ---------- */
let user = null, tab = "home", cat = "foryou";
let following = new Set();
const CATS = [["foryou","သင့်အတွက်"],["following","Following"],["nature","သဘာဝ"],["city","မြို့"],
  ["animals","တိရစ္ဆာန်"],["food","အစားအစာ"],["travel","ခရီး"],["technology","နည်းပညာ"],["people","လူများ"],["sports","အားကစား"]];
const CAT_Q = {nature:"nature",city:"city",animals:"animals",food:"food",travel:"travel",technology:"technology",people:"people",sports:"sports"};

const ICON = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M3.5 11 12 3.8l8.5 7.2v8.7a1.3 1.3 0 0 1-1.3 1.3H15v-6H9v6H4.8a1.3 1.3 0 0 1-1.3-1.3z"/></svg>',
  video:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="3.5"/><path d="m10.5 9.5 4.2 2.5-4.2 2.5z" fill="currentColor"/></svg>',
  camera:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2.2l1.3-2h6l1.3 2h2.2A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  history:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1L3.5 8.5"/><path d="M3.5 4v4.5H8M12 7.5V12l3 2"/></svg>',
  user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c.9-3.6 3.9-5.5 7.5-5.5s6.6 1.9 7.5 5.5"/></svg>'
};
const NAV = [["home","ပင်မ",ICON.home],["video","ဗီဒီယို",ICON.video],["camera","ကင်မရာ",ICON.camera],["history","မှတ်တမ်း",ICON.history],["profile","ကျွန်ုပ်",ICON.user]];

/* ---------- history (local) ---------- */
const HK = "ov_hist_v1";
function hist(){ try{ return JSON.parse(localStorage.getItem(HK) || "[]"); }catch(e){ return []; } }
function addHist(e){
  let a = hist().filter(x => x.key !== e.key);
  a.unshift({...e, ts: Date.now()});
  try{ localStorage.setItem(HK, JSON.stringify(a.slice(0, 100))); }catch(err){}
}

/* ---------- navigation ---------- */
function drawNav(){
  const nav = $("#nav"); nav.replaceChildren();
  NAV.forEach(([id, label, svg]) => {
    const b = h("button", {class: (id === tab ? "on " : "") + (id === "camera" ? "cam" : ""), "aria-label": label, onclick: () => go(id)});
    if(id === "camera") b.append(h("span", {class:"ring", svg}));
    else b.append(h("span", {svg}), label);
    nav.append(b);
  });
}
function drawCats(){
  const box = $("#cats"); box.replaceChildren();
  CATS.filter(c => !(tab === "video" && c[0] === "following")).forEach(([id, label]) => {
    box.append(h("button", {class:"cat" + (id === cat ? " on" : ""), role:"tab", "data-id":id, onclick:() => { cat = id; drawCats(); refresh(); }}, label));
  });
  const on = box.querySelector(".on"); if(on) on.scrollIntoView({inline:"center", block:"nearest"});
}
function refresh(){ if(tab === "home") loadHome(true); else if(tab === "video") loadVideos(true); }
function go(t){
  if(tab === "camera" && t !== "camera") camStop();
  tab = t;
  document.querySelectorAll(".view").forEach(v => v.hidden = v.id !== "v-" + t);
  $("#top").hidden = !(t === "home" || t === "video");
  if(t === "video" && cat === "following") cat = "foryou";
  drawNav(); drawCats();
  if(t === "home") loadHome(true);
  if(t === "video") loadVideos(true);
  if(t === "camera") camOpen();
  if(t === "history") drawHistory();
  if(t === "profile") drawProfile();
}

/* ---------- auth ---------- */
function uname(u){ return (u && ((u.user_metadata && u.user_metadata.username) || (u.email || "").split("@")[0])) || "user"; }
async function loadFollowing(){
  following = new Set();
  if(!sb || !user) return;
  const {data} = await sb.from("follows").select("followee_id");
  (data || []).forEach(r => following.add(r.followee_id));
}
if(sb){
  sb.auth.getSession().then(async ({data}) => { user = data.session ? data.session.user : null; await loadFollowing(); if(tab === "profile") drawProfile(); if(tab === "camera") camOpen(); });
  sb.auth.onAuthStateChange(async (_e, s) => { user = s ? s.user : null; await loadFollowing(); if(tab === "profile") drawProfile(); if(tab === "camera") camOpen(); });
}
function loginCard(why){
  const em = h("input", {type:"email", placeholder:"you@email.com", autocomplete:"email"});
  const msg = h("p", {}, "");
  const send = h("button", {class:"btn pink", onclick: async () => {
    if(!sb){ msg.textContent = "Supabase ကို config.js တွင် မချိတ်ရသေးပါ။"; return; }
    if(!em.value.trim()) return;
    send.disabled = true; msg.textContent = "ပို့နေသည်…";
    const {error} = await sb.auth.signInWithOtp({email: em.value.trim(), options:{emailRedirectTo: location.href.split("#")[0].split("?")[0]}});
    msg.textContent = error ? "မအောင်မြင်ပါ - " + error.message : "Email ကို စစ်ပါ။ Login link ကိုနှိပ်ပြီး ဤ app သို့ ပြန်လာပါ။";
    send.disabled = false;
  }}, "Login link ပို့မည်");
  return h("div", {class:"card"}, h("h3", {}, "အကောင့်ဝင်ရန်"), h("p", {}, why), h("div", {style:"display:grid;gap:10px;margin-top:10px"}, em, send), msg);
}

/* ---------- HOME (snap posts) ---------- */
let hOff = 0, hBusy = false;
async function loadHome(reset){
  const box = $("#feed");
  if(!sb){
    box.replaceChildren(h("div", {class:"card"}, h("h3", {}, "Supabase မချိတ်ရသေးပါ"),
      h("p", {}, "Post များ တင်/ကြည့်နိုင်ရန် config.js တွင် Supabase URL နှင့် key ဖြည့်ပြီး setup.sql ကို run ပါ။ (README ကိုကြည့်ပါ)"),
      h("button", {class:"btn alt", onclick: () => go("video")}, "ဗီဒီယိုများ ကြည့်မည်")));
    $("#hmore").hidden = true; return;
  }
  if(hBusy) return; hBusy = true;
  try{
    if(reset){ hOff = 0; box.replaceChildren(h("div", {class:"msg"}, "ဖွင့်နေသည်…")); }
    let q = sb.from("posts").select("*").gt("expires_at", new Date().toISOString())
      .order("created_at", {ascending:false}).range(hOff, hOff + PER - 1);
    if(cat === "following"){
      if(!user){ box.replaceChildren(loginCard("Follow လုပ်ထားသူများ၏ post များကြည့်ရန် အကောင့်ဝင်ပါ။")); $("#hmore").hidden = true; return; }
      if(!following.size){ box.replaceChildren(h("div", {class:"msg"}, "ဘယ်သူ့ကိုမှ Follow မလုပ်ရသေးပါ။ “သင့်အတွက်” ထဲက post များမှ Follow လုပ်ကြည့်ပါ။")); $("#hmore").hidden = true; return; }
      q = q.in("user_id", [...following]);
    } else if(cat !== "foryou") q = q.eq("category", cat);
    const {data, error} = await q;
    if(error) throw error;
    if(reset) box.replaceChildren();
    (data || []).forEach(p => box.append(postCard(p)));

const IA_NOTE = "လိုင်စင်အချက်အလက်ကို ဖိုင်တင်သူက ကိုယ်တိုင်ဖြည့်ထားခြင်းဖြစ်ပြီး မှားနေနိုင်ပါသည်။ မှန်ကန်မှုမရှိဟု ထင်ပါက Report လုပ်ပါ။";
function licLabel(url){
  if(!url) return null; const u = String(url).toLowerCase();
  if(u.includes("publicdomain")) return "Public Domain";
  const m = u.match(/licenses\/([a-z\-]+)\/([\d.]+)/);
  return m ? "Creative Commons " + m[1].toUpperCase() + " " + m[2] : null;
}
const esc = s => String(s == null ? "" : s);
const VP = {
  async ia(t, page){
    const lic = "(licenseurl:*creativecommons.org* OR licenseurl:*publicdomain*)";
    const col = "collection:(feature_films OR prelinger OR classic_cartoons OR nasa)";
    const q = (t ? `(${t}) AND ` : "") + `mediatype:movies AND (${lic} OR ${col})`;
    const url = "https://archive.org/advancedsearch.php?q=" + encodeURIComponent(q)
      + "&fl[]=identifier&fl[]=title&fl[]=creator&fl[]=licenseurl&sort[]=downloads+desc"
      + `&rows=${PER}&page=${page}&output=json`;
    const j = await (await fetch(url)).json();
    return (j.response.docs || []).map(d => ({
      title: d.title || d.identifier,
      creator: Array.isArray(d.creator) ? d.creator[0] : (d.creator || "Internet Archive"),
      src: "Internet Archive", license: licLabel(d.licenseurl) || "Archive collection",
      licenseUrl: d.licenseurl || ("https://archive.org/details/" + d.identifier),
      note: IA_NOTE, thumb: "https://archive.org/services/img/" + d.identifier,
      embed: "https://archive.org/embed/" + d.identifier, pageUrl: "https://archive.org/details/" + d.identifier,
      key: "ia:" + d.identifier
    }));
  },
  async pexels(t, page){
    if(!C.PEXELS_KEY) return [];
    const base = t ? "https://api.pexels.com/videos/search?query=" + encodeURIComponent(t) + "&" : "https://api.pexels.com/videos/popular?";
    const j = await (await fetch(base + `per_page=${PER}&page=${page}`, {headers:{Authorization:C.PEXELS_KEY}})).json();
    return (j.videos || []).map(v => {
      const f = (v.video_files || []).filter(x => x.file_type === "video/mp4").sort((a, b) => a.width - b.width);
      const pick = f.find(x => x.width >= 640) || f[f.length - 1];
      return {title: (v.url || "").split("/").filter(Boolean).pop().replace(/-\d+$/, "").replace(/-/g, " ") || "Pexels video",
        creator: (v.user && v.user.name) || "Pexels", src: "Pexels", license: "Pexels License",
        licenseUrl: "https://www.pexels.com/license/", thumb: v.image, mp4: pick && pick.link, pageUrl: v.url, key: "px:" + v.id};
    }).filter(x => x.mp4);
  },
  async pixabay(t, page){
    if(!C.PIXABAY_KEY) return [];
    const p = new URLSearchParams({key: C.PIXABAY_KEY, per_page: PER, page, safesearch: "true"});
    if(t) p.set("q", t);
    const j = await (await fetch("https://pixabay.com/api/videos/?" + p)).json();
    return (j.hits || []).map(x => {
      const v = x.videos || {}; const k = v.medium && v.medium.url ? "medium" : (v.small && v.small.url ? "small" : null);
      return k ? {title: (x.tags || "Pixabay video").split(",").slice(0, 3).join(", "), creator: x.user, src: "Pixabay",
        license: "Pixabay Content License", licenseUrl: "https://pixabay.com/service/license-summary/",
        thumb: `https://i.vimeocdn.com/video/${x.picture_id}_640x360.jpg`, mp4: v[k].url, pageUrl: x.pageURL, key: "pb:" + x.id} : null;
    }).filter(Boolean);
  },
  async yt(t, page){
    if(!C.YT_KEY || page > 1) return [];
    let url;
    if(t) url = "https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoEmbeddable=true&safeSearch=moderate&maxResults=" + PER + "&q=" + encodeURIComponent(t) + "&key=" + C.YT_KEY;
    else url = "https://www.googleapis.com/youtube/v3/videos?part=snippet,status&chart=mostPopular&maxResults=" + PER + "&key=" + C.YT_KEY;
    const j = await (await fetch(url)).json();
    return (j.items || []).filter(x => !x.status || x.status.embeddable).map(x => {
      const id = typeof x.id === "string" ? x.id : x.id.videoId;
      return {title: x.snippet.title, creator: x.snippet.channelTitle, src: "YouTube", license: "YouTube ၏ တရားဝင် player",
        licenseUrl: "https://www.youtube.com/watch?v=" + id,
        thumb: (x.snippet.thumbnails.medium || x.snippet.thumbnails.default).url,
        embed: "https://www.youtube-nocookie.com/embed/" + id + "?playsinline=1&rel=0", pageUrl: "https://www.youtube.com/watch?v=" + id, key: "yt:" + id};
    });
  }
};
async function fetchVideos(term, page){
  const res = await Promise.allSettled(Object.values(VP).map(f => f(term, page)));
  const lists = res.filter(r => r.status === "fulfilled").map(r => r.value);
  const out = []; const n = Math.max(0, ...lists.map(l => l.length));
  for(let i = 0; i < n; i++) lists.forEach(l => { if(l[i]) out.push(l[i]); });
  return out;
}

  glasses(c, x, y, R){
    const ry = y - R*.15, rr = R*.38;

    [-1, 1].forEach(s => { c.beginPath(); c.arc(x + s*R*.46, ry, rr, 0, 7); c.fill(); c.stroke(); });
    c.beginPath(); c.moveTo(x - R*.1, ry); c.lineTo(x + R*.1, ry);
    c.moveTo(x - R*.84, ry); c.lineTo(x - R*1.1, ry - R*.05); c.moveTo(x + R*.84, ry); c.lineTo(x + R*1.1, ry - R*.05); c.stroke();
    c.fillStyle = "rgba(255,255,255,.25)";

  },

    c.fillStyle = "#2b1b12"; const my = y + R*.42;
    [-1, 1].forEach(s => { c.beginPath(); c.moveTo(x, my); c.bezierCurveTo(x + s*R*.2, my - R*.22, x + s*R*.6, my - R*.18, x + s*R*.78, my + R*.14);
      c.bezierCurveTo(x + s*R*.5, my + R*.02, x + s*R*.25, my + R*.1, x, my + R*.1); c.closePath(); c.fill(); });

  },
  love(c, x, y, R){ c.font = `${R*.62}px serif`; c.textAlign = "center"; c.textBaseline = "middle"; [-1, 1].forEach(s => c.fillText("❤️", x + s*R*.46, y - R*.15)); },
  halo(c, x, y, R){
    c.strokeStyle = "#ffd84a"; c.lineWidth = R*.1; c.shadowColor = "#ffd84a"; c.shadowBlur = R*.2;
    c.beginPath(); c.ellipse(x, y - R*1.2, R*.55, R*.16, 0, 0, 7); c.stroke(); c.shadowBlur = 0;
  },
  horns(c, x, y, R){
    c.fillStyle = "#c81d25";
    [-1, 1].forEach(s => { c.beginPath(); c.moveTo(x + s*R*.25, y - R*.9); c.quadraticCurveTo(x + s*R*.85, y - R*1.05, x + s*R*.62, y - R*1.7);
      c.quadraticCurveTo(x + s*R*.45, y - R*1.2, x + s*R*.1, y - R*1.0); c.closePath(); c.fill(); });
  },
  fire(c, x, y, R){ c.font = `${R*.9}px serif`; c.textAlign = "center"; c.textBaseline = "middle"; [-1, 1].forEach(s => c.fillText("🔥", x + s*R*1.15, y + R*.1)); }
};

const cv = $("#cv"), cx = cv.getContext("2d");
const cam = {stream:null, video:null, facing:"user", raf:0, tpl:TPL[0], ax:.5, ay:.42, gl:null, mode:"photo", rec:null, chunks:[], t0:0, tick:0, prevStop:null};

const VS = "attribute vec2 a;varying vec2 v;void main(){v=a*.5+.5;gl_Position=vec4(a,0.,1.);}";
const FS = `precision mediump float;varying vec2 v;uniform sampler2D tx;uniform vec2 c;uniform float r,s,asp,t,mir;uniform vec4 crop;uniform int fx,flt;
void main(){
  vec2 p=v;
  if(fx==4){ if(p.x>.5) p.x=1.-p.x; }
  if(fx==5){ p.x+=sin(p.y*18.+t*4.)*.012*s; p.y+=cos(p.x*14.+t*3.)*.008*s; }
  if(fx==1||fx==2||fx==3){
    vec2 d=p-c; d.x*=asp; float dist=length(d);
    if(dist<r&&dist>.0001){
      float k=dist/r;
      if(fx==1){ k=pow(k,1.+s*1.2); d=normalize(d)*k*r; }
      else if(fx==2){ k=pow(k,1./(1.+s*1.2)); d=normalize(d)*k*r; }
      else { float a=s*3.*(1.-k)*(1.-k); float cs=cos(a),sn=sin(a); d=mat2(cs,-sn,sn,cs)*d; }
      d.x/=asp; p=c+d;
    }
  }
  p.x=mix(p.x,1.-p.x,mir);
  vec4 col=texture2D(tx,vec2(p.x*crop.x+crop.z,p.y*crop.y+crop.w));
  float g=dot(col.rgb,vec3(.299,.587,.114));
  if(flt==1) col.rgb=vec3(g);
  else if(flt==2) col.rgb=vec3(g*1.2,g,g*.8);
  else if(flt==3) col.rgb=vec3(col.b,col.r,col.g)*1.3;
  else if(flt==4) col.rgb=floor(col.rgb*4.)/3.;
  else if(flt==5) col.rgb=mix(col.rgb,vec3(g),.4)*vec3(1.1,1.,.85)+.05;
  gl_FragColor=col;
}`;
function glInit(){
  const c = document.createElement("canvas"); c.width = cv.width; c.height = cv.height;
  const gl = c.getContext("webgl", {preserveDrawingBuffer:true}) || c.getContext("experimental-webgl", {preserveDrawingBuffer:true});
  if(!gl) return null;
  const mk = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
  try{
    const pr = gl.createProgram(); gl.attachShader(pr, mk(gl.VERTEX_SHADER, VS)); gl.attachShader(pr, mk(gl.FRAGMENT_SHADER, FS));
    gl.linkProgram(pr); gl.useProgram(pr);
    const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(pr, "a"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    [gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER].forEach(k => gl.texParameteri(gl.TEXTURE_2D, k, gl.LINEAR));
    [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T].forEach(k => gl.texParameteri(gl.TEXTURE_2D, k, gl.CLAMP_TO_EDGE));
    const U = {}; ["c","r","s","asp","t","mir","crop","fx","flt"].forEach(n => U[n] = gl.getUniformLocation(pr, n));
    return {c, gl, U};
  }catch(e){ console.warn("WebGL shader မအောင်မြင်ပါ", e); return null; }
}
function drawFrame(ts){
  cam.raf = requestAnimationFrame(drawFrame);
  const v = cam.video; if(!v || v.readyState < 2 || !v.videoWidth) return;
  const W = cv.width, H = cv.height, tp = cam.tpl;
  const sz = +$("#sz").value, st = tp.st != null && !cam.stTouched ? tp.st : +$("#st").value;
  const mirror = cam.facing === "user";
  const va = v.videoWidth / v.videoHeight, ta = W / H;
  let sx = 1, sy = 1, ox = 0, oy = 0;
  if(va > ta){ sx = ta / va; ox = (1 - sx) / 2; } else { sy = va / ta; oy = (1 - sy) / 2; }
  if(cam.gl){
    const {gl, U, c} = cam.gl;
    gl.viewport(0, 0, W, H);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, v);
    gl.uniform2f(U.c, cam.ax, 1 - cam.ay); gl.uniform1f(U.r, sz); gl.uniform1f(U.s, st); gl.uniform1f(U.asp, W / H);
    gl.uniform1f(U.t, ts / 1000); gl.uniform1f(U.mir, mirror ? 1 : 0); gl.uniform4f(U.crop, sx, sy, ox, oy);
    gl.uniform1i(U.fx, tp.fx || 0); gl.uniform1i(U.flt, tp.flt || 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    cx.drawImage(c, 0, 0);
  } else {
    cx.save(); if(mirror){ cx.translate(W, 0); cx.scale(-1, 1); }
    cx.filter = ["none","grayscale(1)","sepia(1)","hue-rotate(120deg) saturate(2)","contrast(1.6) saturate(1.8)","sepia(.5) contrast(1.1)"][tp.flt || 0];
    cx.drawImage(v, ox * v.videoWidth, oy * v.videoHeight, sx * v.videoWidth, sy * v.videoHeight, 0, 0, W, H); cx.restore();
  }
  const R = sz * H, X = cam.ax * W, Y = cam.ay * H;
  (tp.d || []).forEach(k => { cx.save(); DRAW[k](cx, X, Y, R); cx.restore(); });
  const t = $("#capt").value.trim();
  if(t){
    cx.save(); let fs = W * .09; cx.font = `900 ${fs}px Impact,'Noto Sans Myanmar',sans-serif`;
    while(cx.measureText(t).width > W * .92 && fs > 18){ fs -= 2; cx.font = `900 ${fs}px Impact,'Noto Sans Myanmar',sans-serif`; }
    cx.textAlign = "center"; cx.textBaseline = "alphabetic"; cx.lineJoin = "round"; cx.lineWidth = fs * .16; cx.strokeStyle = "#000"; cx.fillStyle = "#fff";
    cx.strokeText(t, W / 2, H * .92); cx.fillText(t, W / 2, H * .92); cx.restore();
  }
}
async function camStart(){
  camStop();
  try{
    const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:cam.facing, width:{ideal:1280}, height:{ideal:720}}, audio:false});
    cam.stream = stream;
    const v = h("video", {playsinline:true, muted:true, autoplay:true}); v.muted = true; v.srcObject = stream;
    await v.play().catch(() => {}); cam.video = v;
    if(!cam.gl) cam.gl = glInit();
    cam.raf = requestAnimationFrame(drawFrame);
    $("#camHint").hidden = false; setTimeout(() => $("#camHint").hidden = true, 5000);
  }catch(e){
    console.error(e);
    toast("ကင်မရာ ဖွင့်မရပါ။ Browser တွင် ကင်မရာခွင့်ပြုချက် (permission) ပေးထားပါ။");
  }
}
function camStop(){
  cancelAnimationFrame(cam.raf);
  if(cam.rec && cam.rec.state !== "inactive"){ cam.rec.onstop = null; try{ cam.rec.stop(); }catch(e){} }
  clearInterval(cam.tick); $("#timer").hidden = true; $("#shut").classList.remove("rec");
  if(cam.stream) cam.stream.getTracks().forEach(t => t.stop());
  cam.stream = null; cam.video = null;
}
function camOpen(){
  const gate = $("#camGate"), ui = $("#camUI");
  if(!sb || !user){
    camStop(); ui.hidden = true; gate.hidden = false;
    gate.replaceChildren(!sb ? h("div", {class:"card"}, h("h3", {}, "Supabase မချိတ်ရသေးပါ"), h("p", {}, "ကင်မရာ post တင်ရန် config.js ကို အရင်ပြင်ပါ။"))
      : loginCard("ကင်မရာသုံးရန်နှင့် Post တင်ရန် အကောင့်ဝင်ပါ။ (ကြည့်ရုံသာဆိုလျှင် အကောင့်မလိုပါ)"));
    return;
  }
  gate.hidden = true; ui.hidden = false; camStart();
}
function drawTpls(){
  const box = $("#tpls"); box.replaceChildren();
  TPL.forEach(tp => box.append(h("button", {class:"tp" + (tp === cam.tpl ? " on" : ""), onclick: () => { cam.tpl = tp; cam.stTouched = false; drawTpls(); }}, h("i", {}, tp.e), tp.n)));
}
drawTpls();
$("#st").addEventListener("input", () => cam.stTouched = true);
let dragging = false;
function setAnchor(e){
  // canvas ကို object-fit:contain ဖြင့် ပြထားသဖြင့် အမှန်တကယ်ပြသနေသော ဧရိယာအတွင်းသာ တွက်ချက်သည်
  const r = cv.getBoundingClientRect(), ar = cv.width / cv.height;
  let w = r.width, hh = r.height, ox = 0, oy = 0;
  if(w / hh > ar){ w = hh * ar; ox = (r.width - w) / 2; } else { hh = w / ar; oy = (r.height - hh) / 2; }
  cam.ax = Math.min(1, Math.max(0, (e.clientX - r.left - ox) / w));
  cam.ay = Math.min(1, Math.max(0, (e.clientY - r.top - oy) / hh));
}
cv.addEventListener("pointerdown", e => { dragging = true; cv.setPointerCapture(e.pointerId); setAnchor(e); });
cv.addEventListener("pointermove", e => { if(dragging) setAnchor(e); });
cv.addEventListener("pointerup", () => dragging = false);
$("#flip").onclick = () => { cam.facing = cam.facing === "user" ? "environment" : "user"; camStart(); };
$("#modeBtn").onclick = () => {
  cam.mode = cam.mode === "photo" ? "video" : "photo";
  $("#modeBtn").textContent = cam.mode === "photo" ? "📷" : "🎥";
  $("#shut").classList.toggle("vid", cam.mode === "video"); toast(cam.mode === "photo" ? "ဓာတ်ပုံ mode" : "ဗီဒီယို mode (အများဆုံး ၃၀ စက္ကန့်)");
};
$("#shut").onclick = async () => {
  if(!cam.stream) return;
  if(cam.mode === "photo"){ cv.toBlob(b => b && showPreview(b, "image"), "image/jpeg", .9); return; }
  if(cam.rec && cam.rec.state === "recording"){ cam.rec.stop(); return; }
  let mic = null;
  try{ mic = await navigator.mediaDevices.getUserMedia({audio:true}); }catch(e){ toast("မိုက်ခွင့်မရပါ၊ အသံမပါဘဲ ရိုက်ပါမည်"); }
  const out = cv.captureStream(30); if(mic) mic.getAudioTracks().forEach(t => out.addTrack(t));
  const mt = ["video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm","video/mp4"].find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
  if(!mt){ toast("ဤ browser တွင် ဗီဒီယိုရိုက်ခြင်း မထောက်ပံ့ပါ"); return; }
  cam.chunks = []; cam.rec = new MediaRecorder(out, {mimeType: mt, videoBitsPerSecond: 2500000});
  cam.rec.ondataavailable = e => e.data.size && cam.chunks.push(e.data);
  cam.rec.onstop = () => {
    clearInterval(cam.tick); $("#timer").hidden = true; $("#shut").classList.remove("rec");
    if(mic) mic.getTracks().forEach(t => t.stop());
    showPreview(new Blob(cam.chunks, {type: mt.split(";")[0]}), "video");
  };
  cam.rec.start(250); cam.t0 = Date.now(); $("#shut").classList.add("rec"); $("#timer").hidden = false;
  cam.tick = setInterval(() => {
    const s = Math.floor((Date.now() - cam.t0) / 1000); $("#timer").textContent = "● " + Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
    if(s >= 30 && cam.rec.state === "recording") cam.rec.stop();
  }, 250);
};

function showPreview(blob, kind){
  camStop();
  const url = URL.createObjectURL(blob);
  const media = kind === "image" ? h("img", {src:url, class:"player", style:"aspect-ratio:auto;max-height:55vh;object-fit:contain", alt:""})
    : h("video", {src:url, class:"player", style:"aspect-ratio:auto;max-height:55vh", controls:true, playsinline:true, autoplay:true, loop:true});
  const cap = h("input", {placeholder:"စာတန်းရေးရန် (မထည့်လည်းရ)", maxlength:140});
  const sel = h("select", {}, CATS.slice(2).map(([id, l]) => h("option", {value:id}, l)));
  const ok = h("input", {type:"checkbox", style:"width:auto;margin-top:3px"});
  const post = h("button", {class:"btn pink", onclick: async () => {
    if(!ok.checked){ toast("အတည်ပြုချက်ကို အမှန်ခြစ်ပါ"); return; }
    post.disabled = true; post.textContent = "တင်နေသည်…";
    try{
      const ext = kind === "image" ? "jpg" : (blob.type.includes("mp4") ? "mp4" : "webm");
      const path = `${user.id}/${Date.now()}.${ext}`;
      const up = await sb.storage.from("posts").upload(path, blob, {contentType: blob.type || (kind === "image" ? "image/jpeg" : "video/webm")});
      if(up.error) throw up.error;
      const pub = sb.storage.from("posts").getPublicUrl(path).data.publicUrl;
      const ins = await sb.from("posts").insert({author_name: uname(user), caption: cap.value.trim() || null, category: sel.value, media_url: pub, media_type: kind});
      if(ins.error) throw ins.error;
      o.close(); URL.revokeObjectURL(url); toast("တင်ပြီးပါပြီ! ၂၄ နာရီကြာ ပေါ်နေပါမည်"); go("home");
    }catch(e){ console.error(e); toast("မအောင်မြင်ပါ - " + (e.message || e)); post.disabled = false; post.textContent = "၂၄ နာရီ Post တင်မည်"; }
  }}, "၂၄ နာရီ Post တင်မည်");
  const save = h("a", {class:"btn alt", href:url, download:"openvideo-" + Date.now() + (kind === "image" ? ".jpg" : (blob.type.includes("mp4") ? ".mp4" : ".webm")), style:"text-align:center;text-decoration:none"}, "ဖုန်းထဲသိမ်းမည်");
  const o = overlay("ကြည့်ရှုပြီး တင်ရန်", [media, h("div", {style:"display:grid;gap:10px;margin-top:12px"}, cap, sel,
    h("label", {style:"display:flex;gap:8px;font-size:.82rem;color:var(--mu);line-height:1.5"}, ok, "ဤအကြောင်းအရာသည် ကျွန်ုပ်ကိုယ်တိုင်ဖန်တီးထားခြင်းဖြစ်ပြီး ဥပဒေနှင့်ညီညွတ်ကြောင်း၊ သူတစ်ပါး၏ မူပိုင်ခွင့်/ကိုယ်ရေးကိုယ်တာကို မထိခိုက်ကြောင်း အတည်ပြုပါသည်။"),
    post, save, h("button", {class:"btn alt", onclick: () => { o.close(); URL.revokeObjectURL(url); camStart(); }}, "ပယ်ဖျက်ပြီး ပြန်ရိုက်မည်"))]);
}

/* ---------- boot ---------- */
go("home");
</script>
</body>
</html>
